<script src="https://cdn.jsdelivr.net/npm/keycloak-js@25.0.6/dist/keycloak.min.js"></script>

<script>
const keycloak = new Keycloak({
  url: "https://securedev.virtuele.us",
  realm: "virtuele-dev",
  clientId: "web"
});

(async () => {
  try {
    const authenticated = await keycloak.init({
      onLoad: "login-required", // IMPORTANT
      pkceMethod: "S256"
    });

    if (authenticated) {
      console.log("✅ Login successful");

      const bc = new BroadcastChannel("auth-channel");

      bc.postMessage({
        type: "AUTH_SUCCESS",
        token: keycloak.token
      });

      window.close();
    }
  } catch (e) {
    console.error("❌ Keycloak error:", e);
  }
})();
</script>
