<!DOCTYPE html>
<html>
<head>
  <title>Auth Check</title>
  <script src="https://cdn.jsdelivr.net/npm/keycloak-js@25.0.6/dist/keycloak.min.js"></script>
</head>
<body>
<script>
  const keycloak = new Keycloak({
    url: "https://securedev.virtuele.us",
    realm: "virtuele-dev",
    clientId: "web"
  });

  keycloak.init({
    onLoad: "check-sso",
    pkceMethod: "S256"
  }).then(() => {
    // Always go back to main page
    window.location.href = "/trimbleExtensionnagedra/authorization.html";
  });
</script>
</body>
</html>
